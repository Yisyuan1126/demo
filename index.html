<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 繽紛小作家・Gemma 作文分析大師 🌟</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    :root {
      --bg-candy: #fff9f5;
      --bubble-yellow: #fff3c4;
      --bubble-pink: #ffe5ec;
      --bubble-blue: #e0f4ff;
      --coral-pink: #ff6b8b;
      --sun-yellow: #ffb703;
      --mint-green: #06d6a0;
      --sky-blue: #48cae4;
      --taro-purple: #9b5de5;
      --text-dark: #3d3442;
      --text-muted: #7d6e80;
      --card-bg: rgba(255, 255, 255, 0.94);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Quicksand", "Chalkboard SE", "Comic Sans MS", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      max-width: 820px;
      margin: 30px auto;
      padding: 20px;
      background-color: var(--bg-candy);
      background-image: 
        radial-gradient(circle at 10% 12%, rgba(255, 107, 139, 0.12) 0%, transparent 28%),
        radial-gradient(circle at 90% 15%, rgba(255, 183, 3, 0.14) 0%, transparent 32%),
        radial-gradient(circle at 20% 88%, rgba(72, 202, 228, 0.13) 0%, transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(155, 93, 229, 0.12) 0%, transparent 32%);
      color: var(--text-dark);
      min-height: 100vh;
      line-height: 1.65;
    }

    /* 頂部裝飾小貼紙彩帶 */
    .decor-banner {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .sticker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #ffffff;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(255, 107, 139, 0.12);
      border: 2px dashed #ffccd5;
      color: var(--coral-pink);
      animation: floatBadge 3s ease-in-out infinite alternate;
    }

    .sticker.yellow {
      border-color: #ffe699;
      color: #d48b00;
      animation-delay: 0.6s;
    }

    .sticker.blue {
      border-color: #b3e5fc;
      color: #0288d1;
      animation-delay: 1.2s;
    }

    @keyframes floatBadge {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-4px) rotate(1.5deg); }
    }

    /* 主卡片容器 */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 38px 42px;
      border-radius: 32px;
      border: 3.5px solid #ffccd5;
      box-shadow: 
        0 18px 40px rgba(255, 107, 139, 0.15),
        0 6px 16px rgba(255, 183, 3, 0.12),
        inset 0 0 20px rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* 卡片頂部糖果彩虹橫條 */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, #ff6b8b, #ff9f1c, #ffd166, #06d6a0, #48cae4, #9b5de5);
    }

    /* 標題與副標題 */
    h2 {
      margin-top: 5px;
      font-size: 2.1rem;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #ff6b8b 0%, #ff9f1c 45%, #9b5de5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(255, 107, 139, 0.15));
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 30px;
      text-align: center;
      font-weight: 500;
    }

    /* 表單區塊 */
    .form-group {
      margin-bottom: 24px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      font-weight: 700;
      font-size: 0.96rem;
      color: #4a3848;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .label-icon {
      font-size: 1.15rem;
    }

    .word-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e07a5f;
      background: #fff0eb;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid #ffccd5;
    }

    /* 輸入框風格 */
    input[type="password"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 14px 18px;
      background: #ffffff;
      border: 2.5px solid #ffd6e0;
      border-radius: 18px;
      box-sizing: border-box;
      color: var(--text-dark);
      font-size: 0.96rem;
      font-family: inherit;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.8;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--coral-pink);
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(255, 107, 139, 0.22);
      transform: translateY(-1px);
    }

    select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff6b8b'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 20px;
    }

    /* 魔法大師送出按鈕 */
    button {
      background: linear-gradient(135deg, #ff6b8b 0%, #ff9f1c 50%, #ffd166 100%);
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      font-weight: 800;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      font-size: 1.15rem;
      letter-spacing: 1px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 24px rgba(255, 107, 139, 0.35);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-3px) scale(1.015);
      box-shadow: 0 12px 30px rgba(255, 107, 139, 0.45);
      filter: brightness(1.04);
    }

    button:active {
      transform: translateY(1px) scale(0.985);
    }

    button:disabled {
      background: #e2d9e0;
      color: #9e8e9b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* 批改結果報告卡片 */
    .report-box {
      margin-top: 32px;
      padding: 28px;
      background: #fffdf9;
      border: 2.5px dashed #ffd6a5;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(255, 183, 3, 0.08);
      position: relative;
    }

    .report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #ffe5b4;
    }

    .report-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #d46b08;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #result {
      font-size: 0.98rem;
      line-height: 1.85;
      color: #4a3e46;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Markdown 渲染美化樣式 */
    .res-h2 {
      font-size: 1.25rem;
      color: #d44d72;
      margin: 18px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #ffd6e0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .res-h3 {
      font-size: 1.1rem;
      color: #8338ec;
      margin: 14px 0 6px 0;
    }

    .res-bold {
      color: #e63946;
      font-weight: 700;
      background: #fff0f3;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .res-li-num {
      margin: 8px 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .num-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #ff6b8b, #ff9f1c);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .res-li-bullet {
      margin: 6px 0;
      padding-left: 6px;
    }

    .bullet-star {
      color: #ffb703;
      margin-right: 6px;
    }

    .paragraph-break {
      height: 12px;
    }

    /* 響應式優化 */
    @media (max-width: 600px) {
      .card {
        padding: 24px 20px;
        border-radius: 24px;
      }
      h2 {
        font-size: 1.7rem;
      }
      .decor-banner {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部童趣小貼紙 -->
  <div class="decor-banner">
    <div class="sticker">🎨 魔法筆刷</div>
    <div class="sticker yellow">🌟 創意大冒險</div>
    <div class="sticker blue">🚀 靈感起飛</div>
  </div>

  <div class="card">
    <h2>🎨 繽紛小作家・Gemma 作文分析大師 🌟</h2>
    <p class="subtitle">🎈 帶著童心與想像力，讓 Gemma 陪伴你探索文字魔法、點亮每篇好文章！</p>

    <!-- Token 輸入 -->
    <div class="form-group">
      <div class="label-row">
        <label for="apiKey">
          <span class="label-icon">🔑</span>
          <span>Hugging Face Token (HF_TOKEN)</span>
        </label>
      </div>
      <input type="password" id="apiKey" placeholder="請貼上您的 HF_TOKEN (例如 hf_...)" onchange="saveToken()">
    </div>

    <!-- 寫作標準選擇 -->
    <div class="form-group">
      <div class="label-row">
        <label for="essayStyle">
          <span class="label-icon">📚</span>
          <span>寫作探險類型（批改標準）</span>
        </label>
      </div>
      <select id="essayStyle">
        <option value="童趣故事與感性散文（注重想像力、童趣文筆、情感真摯、豐富修辭）">🎈 兒童童趣故事 / 感性散文（想像力、生動描繪、情感真摯）</option>
        <option value="國寫感性與知性散文（注重立意取材、結構層次、修辭文采）">📖 國寫 / 一般散文（立意構思、結構層次、文字修辭）</option>
        <option value="論說文 / 議論文（注重論點明確、論據充分、邏輯推演）">💡 論說文 / 思考表達（觀點鮮明、論據充分、條理邏輯）</option>
        <option value="英文作文 Academic / TOEFL / IELTS（注重文法精確、詞彙多樣性、句型變化與連貫性）">🌍 英文作文 English Essay（文法精確、詞彙豐富、流暢連貫）</option>
        <option value="童詩 / 創意文案 / 自我介紹（注重趣味性、韻律感、亮眼吸睛）">✨ 創意童詩 / 趣味自介（韻律美感、生動吸睛）</option>
      </select>
    </div>

    <!-- 作文輸入 -->
    <div class="form-group">
      <div class="label-row">
        <label for="essayInput">
          <span class="label-icon">📝</span>
          <span>你的精彩大作（作文內容）</span>
        </label>
        <span class="word-count" id="wordCount">✨ 已寫了 0 個字</span>
      </div>
      <textarea id="essayInput" placeholder="在這裡寫下或貼上你的故事、題目與內容，準備施展文字魔法吧！" oninput="updateWordCount()"></textarea>
    </div>

    <!-- 額外要求 -->
    <div class="form-group">
      <div class="label-row">
        <label for="customPrompt">
          <span class="label-icon">💡</span>
          <span>許個小願望（額外批改需求，選填）</span>
        </label>
      </div>
      <input type="text" id="customPrompt" placeholder="例如：我想讓故事更生動有趣、請幫我檢查錯別字或推薦優美成語！">
    </div>

    <!-- 啟動按鈕 -->
    <button id="submitBtn" onclick="analyzeEssay()">
      <span>🚀 召喚魔法大師・開始深度批改 ✨</span>
    </button>

    <!-- 批改報告區 -->
    <div class="report-box">
      <div class="report-header">
        <div class="report-title">
          <span>💌</span>
          <span>大師的文字魔法評語與錦囊</span>
        </div>
      </div>
      <div id="result">大師已準備好魔法筆記本，請輸入作文並點擊上方按鈕開始深度賞析！✏️🌟</div>
    </div>
  </div>

  <script>
    // 頁面載入時自動讀取已儲存的 Token
    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('hf_token_cache');
      if (savedToken) {
        document.getElementById('apiKey').value = savedToken;
      }
    });

    function saveToken() {
      const token = document.getElementById('apiKey').value.trim();
      if (token) {
        localStorage.setItem('hf_token_cache', token);
      }
    }

    // 計算字數
    function updateWordCount() {
      const text = document.getElementById('essayInput').value;
      const cleanText = text.replace(/\s+/g, '');
      document.getElementById('wordCount').innerText = `✨ 已寫了 ${cleanText.length} 個字`;
    }

    // 簡易 Markdown 格式化轉 HTML（讓輸出更可愛立體）
    function formatMarkdown(text) {
      if (!text) return '';
      let html = text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/^### (.*$)/gim, '<h3 class="res-h3">✨ $1</h3>')
        .replace(/^## (.*$)/gim, '<h2 class="res-h2">🌟 $1</h2>')
        .replace(/^# (.*$)/gim, '<h2 class="res-h2">🎉 $1</h2>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong class="res-bold">$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em>$1</em>')
        .replace(/^(\d+)\.\s+(.*$)/gim, '<div class="res-li-num"><span class="num-badge">$1</span><span>$2</span></div>')
        .replace(/^[-*]\s+(.*$)/gim, '<div class="res-li-bullet"><span class="bullet-star">⭐</span>$1</div>')
        .replace(/\n\n/g, '<div class="paragraph-break"></div>')
        .replace(/\n/g, '<br>');
      return html;
    }

    async function analyzeEssay() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const essayStyle = document.getElementById('essayStyle').value;
      const essayText = document.getElementById('essayInput').value.trim();
      const customPrompt = document.getElementById('customPrompt').value.trim();
      const resultDiv = document.getElementById('result');
      const submitBtn = document.getElementById('submitBtn');

      if (!apiKey) {
        alert('請先輸入 Hugging Face Token (HF_TOKEN)！🔑');
        return;
      }
      if (!essayText) {
        alert('請先輸入或貼上要分析的作文內容喔！📝');
        return;
      }

      saveToken();

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>🎨 大師正施展魔法細細閱讀中，請稍候... ⏳</span>';
      resultDiv.innerHTML = '<div style="color: #ff6b8b; font-weight: bold; text-align: center; padding: 20px;">🪄 魔法調色盤轉動中... 正在為您的作文進行多維度分析與潤飾！🌟</div>';

      const systemInstruction = `你是一位親切、幽默、充滿童心且極具專業素養的「作文魔法大師」。
請以溫暖親切的繁體中文，針對學生的文章進行富有啟發性、童趣感且具建設性的深度批改與賞析。

批改類型與風格：${essayStyle}
${customPrompt ? `學生的額外小願望：${customPrompt}` : ''}

請務必按照以下架構，用生動活潑、多使用正面鼓勵的語氣呈現報告：
1. 【整體總評與魔法評分】（滿分 100 分，附帶溫暖激勵的總結與核心亮點）
2. 【閃閃發光的優點與佳句賞析】（精確指出值得誇獎的好段落、生動詞彙、感人修辭或奇思妙想）
3. 【小魔法升級指南（建議與改進）】（溫柔指出可以更好的地方，如結構銜接、詞彙重複、錯別字或邏輯推展）
4. 【大師示範畫龍點睛】（挑選 1～2 個段落，展示改寫後的生動版本，並解釋為什麼這樣寫會更有畫面感與感染力）`;

      try {
        const response = await fetch("https://router.huggingface.co/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "google/gemma-4-31B-it:novita",
            messages: [
              {
                role: "system",
                content: systemInstruction
              },
              {
                role: "user",
                content: `請幫我分析批改以下這篇作文：\n\n${essayText}`
              }
            ],
            max_tokens: 1500,
            temperature: 0.7
          })
        });

        const data = await response.json();
        if (response.ok && data.choices && data.choices.length > 0) {
          const content = data.choices[0].message.content;
          resultDiv.innerHTML = formatMarkdown(content);
        } else {
          resultDiv.innerText = `發生錯誤：${data.error?.message || JSON.stringify(data)}`;
        }
      } catch (error) {
        resultDiv.innerText = `連線發生錯誤：${error.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>🚀 召喚魔法大師・開始深度批改 ✨</span>';
      }
    }
  </script>
</body>
</html>
