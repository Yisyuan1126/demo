<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemma 作文分析大師</title>
  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-color: #dcd6c8;
      --primary-accent: #2c5282;
      --secondary-accent: #4a5568;
      --highlight-gold: #b7791f;
      --text-main: #2d3748;
      --text-muted: #718096;
    }

    body {
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 780px;
      margin: 40px auto;
      padding: 20px;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(44, 82, 130, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(183, 121, 31, 0.06) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
    }

    .card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary-accent), var(--highlight-gold));
    }

    h2 {
      margin-top: 0;
      font-size: 1.9rem;
      color: var(--primary-accent);
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--secondary-accent);
      letter-spacing: 0.5px;
    }

    .word-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type="password"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 14px 16px;
      background: #ffffff;
      border: 1px solid #cbd5e0;
      border-radius: 10px;
      box-sizing: border-box;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.8;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.15);
    }

    button {
      background: linear-gradient(135deg, #2c5282, #1a365d);
      color: #fff;
      border: none;
      padding: 15px 24px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(44, 82, 130, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(44, 82, 130, 0.35);
    }

    button:disabled {
      background: #cbd5e0;
      color: #718096;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    #result {
      margin-top: 10px;
      padding: 24px;
      background: #faf9f6;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--highlight-gold);
      border-radius: 8px;
      white-space: pre-wrap;
      min-height: 100px;
      font-size: 0.98rem;
      line-height: 1.85;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>✒️ Gemma 作文分析大師</h2>
    <p class="subtitle">透過 Hugging Face Router 呼叫 gemma-4-31B-it 模型進行深度文意賞析與結構批改</p>

    <div class="form-group">
      <div class="label-row">
        <label for="apiKey">Hugging Face Token (HF_TOKEN)</label>
      </div>
      <input type="password" id="apiKey" placeholder="請輸入您的 HF_TOKEN (hf_...)">
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="essayStyle">批改標準 / 寫作類型</label>
      </div>
      <select id="essayStyle">
        <option value="國寫感性與知性散文（注重立意取材、結構層次、修辭文采）">國寫 / 一般散文（立意、結構、文采）</option>
        <option value="論說文 / 議論文（注重論點明確、論據充分、邏輯推演）">論說文 / 議論文（論點、論據、邏輯）</option>
        <option value="英文作文 Academic / TOEFL / IELTS（注重文法精確、詞彙多樣性、句型變化與連貫性）">英文作文（文法、詞彙、句型、連貫性）</option>
        <option value="商業文案 / 自我介紹（注重吸引力、精準度、說服力）">商業文案 / 自我介紹（精準度與說服力）</option>
      </select>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="essayInput">作文內容</label>
        <span class="word-count" id="wordCount">字數：0 字</span>
      </div>
      <textarea id="essayInput" placeholder="請在此貼上或輸入您的作文題目與內文..." oninput="updateWordCount()"></textarea>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="customPrompt">額外批改要求（選填）</label>
      </div>
      <input type="text" id="customPrompt" placeholder="例如：請幫我潤飾第二段的描寫，或針對錯別字進行檢查">
    </div>

    <button id="submitBtn" onclick="analyzeEssay()">開始深度批改</button>

    <div class="form-group" style="margin-top: 28px;">
      <div class="label-row">
        <label>大師批改報告</label>
      </div>
      <div id="result">大師已準備就緒，請輸入作文並點擊「開始深度批改」...</div>
    </div>
  </div>

  <script>
    function updateWordCount() {
      const text = document.getElementById('essayInput').value;
      const cleanText = text.replace(/\s+/g, '');
      document.getElementById('wordCount').innerText = `字數：${cleanText.length} 字`;
    }

    async function analyzeEssay() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const essayStyle = document.getElementById('essayStyle').value;
      const essayText = document.getElementById('essayInput').value.trim();
      const customPrompt = document.getElementById('customPrompt').value.trim();
      const resultDiv = document.getElementById('result');
      const submitBtn = document.getElementById('submitBtn');

      if (!apiKey) {
        alert('請先輸入 Hugging Face Token！');
        return;
      }
      if (!essayText) {
        alert('請先輸入要分析的作文內容！');
        return;
      }

      submitBtn.disabled = true;
      resultDiv.innerText = '大師正在細讀您的文章並撰寫批改建議，請稍候...';

      const systemInstruction = `你是一位資深且專業的作文批改大師。請以繁體中文（若文章為英文則以繁體中文進行解析與講評）針對以下文章進行深度分析。
批改標準與類型：${essayStyle}
${customPrompt ? `使用者額外要求：${customPrompt}` : ''}

請嚴格按照以下架構提供清晰、具體且具建設性的批改報告：
1. 【整體總評與給分】（滿分 100 分，並簡述文章核心亮點與整體表現）
2. 【優點與佳句賞析】（點出寫得好的段落、修辭或立意）
3. 【待改進與具體建議】（指出邏輯斷層、用詞重複、結構鬆散或錯別字等問題）
4. 【段落潤飾示範】（挑選文章中最需要提升的 1～2 個段落，提供修改後的優化版本並說明原因）`;

      try {
        const response = await fetch("https://router.huggingface.co/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "google/gemma-4-31B-it:novita",
            messages: [
              {
                role: "system",
                content: systemInstruction
              },
              {
                role: "user",
                content: `請幫我分析批改以下這篇作文：\n\n${essayText}`
              }
            ],
            max_tokens: 1500,
            temperature: 0.7
          })
        });

        const data = await response.json();
        if (response.ok && data.choices && data.choices.length > 0) {
          resultDiv.innerText = data.choices[0].message.content;
        } else {
          resultDiv.innerText = `發生錯誤：${data.error?.message || JSON.stringify(data)}`;
        }
      } catch (error) {
        resultDiv.innerText = `發生錯誤：${error.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
